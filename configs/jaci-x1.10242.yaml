# ==============================================================================
# MPASWF — JACI PLATFORM CONFIGURATION FOR THE x1.10242 MESH
# ==============================================================================
#
# This file contains only machine/site settings. Campaign logic and product
# naming live in configs/mpas-x1.10242.yaml and are merged automatically.
#
# The software contract is intentionally simple: MPASWF consumes one validated
# MONAN-JEDI installation prefix. It does not know where MONAN-JEDI sources,
# build trees, WPS source trees, or versioned WPS releases are located.
#
# Expected public layout below software.monan_jedi_root:
#
#   bin/mpas_init_atmosphere
#   bin/mpas_atmosphere
#   bin/ungrib.exe
#   bin/link_grib.csh
#   share/wps/Variable_Tables/Vtable.GFS
#
# The compiled runtime still depends on the validated external spack-stack.
# PBS jobs therefore bootstrap the same JACI/JEDI environment used to build and
# validate MONAN-JEDI before invoking mpiexec. This is a separate runtime-
# environment contract; it does not expose MONAN-JEDI source/build paths.
#
# Historical all-in-one configs with executables.wps_dir/mpas_init/
# mpas_atmosphere remain supported as a compatibility fallback.
# ==============================================================================

workflow:
  configuration: mpas-x1.10242.yaml

# One public software prefix produced by GAD-DIMNT-CPTEC/MONAN-JEDI.
software:
  monan_jedi_root: /p/projetos/monan_das/$USER/build/monan-jedi

paths:
  work_dir: /p/projetos/monan_das/$USER/work/mpaswf
  static_dir: /p/projetos/monan_das/$USER/work/mpaswf/static
  gfs_dir: /p/projetos/monan_das/$USER/data/gfs

  # Case templates are versioned with MPASWF so a checkout is self-contained.
  # This path is resolved relative to this platform configuration file.
  cdct_templates_dir: ../templates/x1.10242

# Fixed mesh/support inputs used by MPAS initialization and forecasts.
static:
  links:
    - source: /p/projetos/monan_das/$USER/projects/mpas_meshes/quasi_uniform/x1.10242_240km/mesh/x1.10242.grid.nc
      target: x1.10242.grid.nc

    - source: /p/projetos/monan_das/$USER/projects/mpas_meshes/quasi_uniform/x1.10242_240km/partitions/x1.10242.graph.info.part.128
      target: x1.10242.graph.info.part.128

execution:
  backend: pbs

pbs:
  queue: pesqmini
  select: 1
  ncpus: 128
  mpiprocs: 128
  place: excl

  walltime_static: "00:20:00"
  walltime_init: "00:30:00"
  walltime_forecast: "03:00:00"

  queue_smoke: pesqmini
  walltime_smoke: "00:02:00"

  launcher: ["mpiexec", "-n", "{mpi_ranks}"]
  qsub_command: ["qsub"]
  qstat_command: ["qstat", "-f"]
  poll_seconds: 30

  # Compute-node bootstrap for the exact validated JACI spack-stack/JEDI
  # environment. The same sequence is used by pbs-smoke, init and forecast.
  bootstrap:
    - "module --force purge 2>/dev/null || module purge"
    - "module use /opt/cray/pe/modulefiles"
    - "module use /opt/cray/modulefiles"
    - "module use /opt/cray/pe/craype-targets/default/modulefiles"
    - "module use /p/app/modulefiles"
    - "module use /opt/cray/pals/modulefiles"
    - "pushd /p/projetos/monan_das/$USER/work/spack-stack-inpe-overlay-20260515T181917Z/spack-stack >/dev/null"
    - "source configs/sites/tier2/jaci/setup.sh"
    - "popd >/dev/null"
    - "module use /p/projetos/monan_das/$USER/work/spack-stack-inpe-overlay-20260515T181917Z/spack-stack/envs/jaci-mpas-jedi-gcc12-craympich/modules"
    - "module load cray-mpich/8.1.31/none/none/jedi-mpas-env/1.0.0"

  environment:
    OMP_NUM_THREADS: "1"
    FI_CXI_RX_MATCH_MODE: "hybrid"
    F_UFMTENDIAN: "big"
