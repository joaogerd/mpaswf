# JACI functional smoke test for the WPS runtime published by MONAN-JEDI.
# Replace USER and cdct_templates_dir before running.
#
# This single valid time requires initialization analyses at 2026062200 and
# 2026062300 because the campaign uses f024 and f048 forecasts.

paths:
  work_dir: /p/projetos/monan_das/USER/work/mpaswf-wps-smoke
  static_dir: /p/projetos/monan_das/USER/work/mpaswf-wps-smoke/static
  gfs_dir: /p/projetos/monan_das/USER/work/nmc_bmatrix_20260622_20260625/inputs/gfs
  cdct_templates_dir: /p/projetos/monan_das/USER/cdct/templates

executables:
  wps_dir: /p/projetos/monan_das/USER/builds/monan-jedi
  mpas_init: /p/projetos/monan_das/USER/builds/monan-jedi/bin/mpas_init_atmosphere
  mpas_atmosphere: /p/projetos/monan_das/USER/builds/monan-jedi/bin/mpas_atmosphere

campaign:
  start_valid_time: "2026-06-24T00:00:00Z"
  end_valid_time: "2026-06-24T00:00:00Z"
  interval_hours: 6
  leads_hours: [24, 48]

gfs:
  file_template: "gfs.t{init_hour}z.pgrb2.0p25.f000"
  url_template: null
  minimum_size_bytes: 1048576

wps:
  output_template: "FILE:{init_date_yyyy_mm_dd_hh}"
  vtable: "{wps_root}/share/wps/Vtable"
  namelist_target: namelist.wps
  link_grib_command: ["./link_grib.csh", "{gfs_file}"]
  ungrib_command: ["./ungrib.exe"]

products:
  init_state_template: "x1.10242.init.{init_date_yyyy_mm_dd_hh_mm_ss}.nc"
  restart_template: "restart.{valid_date_yyyy_mm_dd_hh_mm_ss}.nc"
  da_state_template: "mpasout.{valid_date_yyyy_mm_dd_hh_mm_ss}.nc"

templates:
  wps: "namelist.wps.in"
  static_namelist: "namelist.init_atmosphere.static.in"
  static_streams: "streams.init_atmosphere.static.in"
  init_namelist: "namelist.init_atmosphere.in"
  init_streams: "streams.init_atmosphere.in"
  forecast_namelist: "namelist.atmosphere.in"
  forecast_streams: "streams.atmosphere.in"

# Required by the complete MPASWF schema, but not executed by phase prepare.
static:
  reference_time: "2010-10-23T00:00:00Z"
  product_template: "x1.10242.static.nc"
  links: []

execution:
  backend: pbs

pbs:
  queue: pesqmini
  select: 1
  ncpus: 128
  mpiprocs: 128
  walltime_static: "00:20:00"
  walltime_init: "00:30:00"
  walltime_forecast: "03:00:00"
  launcher: ["mpiexec", "-n", "{mpi_ranks}"]
  qsub_command: ["qsub"]
  qstat_command: ["qstat", "-f"]
  poll_seconds: 30
  modules:
    - "module load PrgEnv-gnu"
    - "module load cray-mpich"
  environment:
    OMP_NUM_THREADS: "1"
    FI_CXI_RX_MATCH_MODE: "hybrid"
    F_UFMTENDIAN: "big"

validation:
  require_netcdf: false
  minimum_size_bytes: 1024
